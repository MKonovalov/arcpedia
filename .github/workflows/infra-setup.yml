name: Cloudflare Infra Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull secrets from Bitwarden
        id: bws-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN
            ${{ vars.SM_CLOUDFLARE_ACCOUNT_ID }} > CLOUDFLARE_ACCOUNT_ID

      - name: Verify Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/setup-cloudflare.sh

      - name: Check generated wrangler.toml
        run: |
          set -euo pipefail
          if grep -q '<arcpedia_.*_NAMESPACE_ID>' wrangler.toml; then
            echo "::error::wrangler.toml still contains placeholder namespace IDs."
            exit 1
          fi

      - name: Upload generated wrangler.toml
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-wrangler-toml
          path: wrangler.toml
          if-no-files-found: error
