name: Deploy Journal to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-journal-pages.yml"
      - ".arc/journal.md"
      - "journal-site/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-journal
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # journal-site/build.mjs is pure Node stdlib — no install needed.
      - name: Build journal site
        run: node journal-site/build.mjs

      - name: Deploy to public journal repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # PAT must have `repo` scope on the PUBLIC target repo.
          # Stored as a GitHub secret in THIS (private) repo.
          personal_token: ${{ secrets.PAGES_PAT }}
          publish_dir: ./journal-site/dist
          # Coexist with arc-evolve's site on the SAME public repo: arcpedia's
          # journal publishes under /journal and keeps arc-evolve's /arc-evolve.
          destination_dir: journal
          external_repository: MKonovalov/arcpedia-journal
          publish_branch: gh-pages
          keep_files: true
          commit_message: "deploy journal: ${{ github.sha }}"
