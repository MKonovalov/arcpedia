name: Deploy Journal to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-journal-pages.yml"
      - ".arc/journal.md"
      - "journal-site/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-journal
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build journal site
        run: pnpm journal:build

      - name: Deploy to public journal repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # PAT must have `repo` scope on the PUBLIC target repo.
          # Stored as a GitHub secret in THIS (private) repo.
          personal_token: ${{ secrets.PAGES_PAT }}
          publish_dir: ./journal-site/dist
          external_repository: MKonovalov/arcpedia-journal
          publish_branch: gh-pages
          commit_message: "deploy journal: ${{ github.sha }}"
