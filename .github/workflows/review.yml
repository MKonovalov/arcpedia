name: arc Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: arc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only review arc's own PRs from this repo (not forks)
    if: >
      startsWith(github.event.pull_request.head.ref, 'arc/') &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Pull secrets from Bitwarden
        id: bws-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_ANTHROPIC_API_KEY }} > ANTHROPIC_API_KEY
            ${{ vars.SM_X_BEARER_TOKEN }} > X_BEARER_TOKEN
            ${{ secrets.SM_ARCPEDIA_GITHUB_TOKEN }} > ARCPEDIA_GITHUB_TOKEN

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SM_APP_ID }}
          private-key: ${{ vars.SM_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is sourced from the "packageManager" field in package.json (pnpm@9.15.9, no integrity hash).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install || true

      - name: Configure git
        run: |
          SLUG="${{ steps.bot-token.outputs.app-slug }}"
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"

      - name: Run arc Review
        uses: mkonovalov/arc-action@v2
        with:
          agent: review
          args: ${{ github.event.pull_request.number }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          gh_token: ${{ env.ARCPEDIA_GITHUB_TOKEN }}
