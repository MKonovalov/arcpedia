name: arc PM

on:
  schedule:
    - cron: '0 5,13,21 * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      focus:
        description: 'What area should the PM focus on?'
        required: false

concurrency:
  group: arc-pm
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, 'Ask-PM:') }}

    steps:
      - name: Pull secrets from Bitwarden
        id: bws-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_ANTHROPIC_API_KEY }} > ANTHROPIC_API_KEY
            ${{ vars.SM_X_BEARER_TOKEN }} > X_BEARER_TOKEN
            ${{ secrets.SM_ARCPEDIA_GITHUB_TOKEN }} > ARCPEDIA_GITHUB_TOKEN

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SM_APP_ID }}
          private-key: ${{ vars.SM_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is sourced from the "packageManager" field in package.json (pnpm@9.15.9, no integrity hash).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install || true

      - name: Configure git
        run: |
          SLUG="${{ steps.bot-token.outputs.app-slug }}"
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"

      - name: Run arc PM
        uses: mkonovalov/arc-action@v2.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        with:
          agent: pm
          args: ${{ github.event_name == 'issue_comment' && format('decision-discussion issue {0}', github.event.issue.number) || github.event_name == 'workflow_dispatch' && github.event.inputs.focus || '' }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          gh_token: ${{ env.ARCPEDIA_GITHUB_TOKEN }}
