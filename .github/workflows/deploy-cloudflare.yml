name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.*"
      - "open-next.config.*"
      - "wrangler.jsonc"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is sourced from the "packageManager" field in package.json.
        # Do NOT also set "version:" here — pnpm/action-setup@v4 aborts with
        # ERR_PNPM_BAD_PM_VERSION when both are present.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull secrets from Bitwarden
        id: bws-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN
            ${{ vars.SM_CLOUDFLARE_ACCOUNT_ID }} > CLOUDFLARE_ACCOUNT_ID

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build Cloudflare Worker
        env:
          # Public site-owner handle — inlined into the client bundle at build
          # time so the nav can gate owner-only tools (e.g. Lint). The server
          # gates read it too. Public (not a secret); override via the repo var.
          NEXT_PUBLIC_OWNER_HANDLE: ${{ vars.NEXT_PUBLIC_OWNER_HANDLE || 'arcpedia' }}
        run: pnpm build:cloudflare

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      # Standalone consumer for the agent task queue (Cloudflare Queues). Drains
      # `arcpedia-tasks` and POSTs each task to the main app's /api/tasks/run.
      # Secret arcpedia_SERVICE_TOKEN is set once via
      # `wrangler secret put --config workers/task-consumer/wrangler.jsonc`; the
      # queue + DLQ are created once via `wrangler queues create`.
      - name: Deploy task-consumer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/task-consumer/wrangler.jsonc
