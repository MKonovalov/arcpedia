name: arc Build

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to implement'
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'ready'

    steps:
      - name: Pull secrets from Bitwarden
        id: bws-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_ANTHROPIC_API_KEY }} > ANTHROPIC_API_KEY
            ${{ vars.SM_X_BEARER_TOKEN }} > X_BEARER_TOKEN
            ${{ secrets.SM_ARCPEDIA_GITHUB_TOKEN }} > ARCPEDIA_GITHUB_TOKEN

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SM_APP_ID }}
          private-key: ${{ vars.SM_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is sourced from the "packageManager" field in package.json (pnpm@9.15.9, no integrity hash).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>/dev/null || pnpm install || true

      - name: Configure git
        run: |
          SLUG="${{ steps.bot-token.outputs.app-slug }}"
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"

      - name: Determine issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "number=$EVENT_ISSUE" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_ISSUE" ]; then
            echo "number=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run arc Build
        uses: MKonovalov/arc-action@v2.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        with:
          agent: build
          args: ${{ steps.issue.outputs.number }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          gh_token: ${{ env.ARCPEDIA_GITHUB_TOKEN }}
