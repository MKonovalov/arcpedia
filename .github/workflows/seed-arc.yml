name: Seed arc

# Keeps the arcpedia "arc" agent in sync with the canonical identity in
# mkonovalov/arc-evolve. Assembles arc's identity / learnings / social pages
# from that repo and POSTs them to /api/agents/seed.
#
# Auth: a service token (NOT a human Clerk session) — see src/lib/auth.ts
# getServicePrincipal(). seedAgent is idempotent and preserves ownership, so a
# weekly re-seed refreshes the content without changing the owner.
#
# Required config:
#   - secret arcpedia_SERVICE_TOKEN  — must equal the Worker secret of the same name
#   - (Worker secrets, set via wrangler) arcpedia_SERVICE_TOKEN + arcpedia_SERVICE_PRINCIPAL
#   - optional repo variable arcpedia_URL (defaults to the production Worker URL)

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {} # manual run — needed for the very first seed

permissions:
  contents: read

concurrency:
  group: seed-arc
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out arc-evolve identity (private repo — needs a PAT)
        uses: actions/checkout@v6
        with:
          repository: mkonovalov/arc-evolve
          path: arc-evolve
          token: ${{ secrets.ARC_EVOLVE_PAT }}

      - name: Build seed payload
        run: |
          cat > build-seed.mjs <<'EOF'
          import { readFileSync, existsSync, writeFileSync } from "node:fs";

          const ROOT = "arc-evolve";
          const read = (rel) => {
            const path = `${ROOT}/${rel}`;
            return existsSync(path) ? readFileSync(path, "utf8").trim() : "";
          };

          // Maps arc-evolve's identity files onto seedAgent sections.
          const defs = [
            { type: "identity",  slug: "arc-identity",      title: "arc — Identity",             file: "IDENTITY.md" },
            { type: "identity",  slug: "arc-personality",   title: "arc — Voice & Personality",  file: "PERSONALITY.md" },
            { type: "identity",  slug: "arc-economics",     title: "arc — Economics",            file: "ECONOMICS.md" },
            { type: "learnings", slug: "arc-learnings",     title: "arc — Learnings",            file: "memory/active_learnings.md" },
            { type: "social",    slug: "arc-social-wisdom", title: "arc — Social Wisdom",        file: "memory/active_social_learnings.md" },
          ];

          // Skip any file that is missing or empty — seedAgent rejects empty content.
          const sections = defs
            .map((d) => ({ type: d.type, slug: d.slug, title: d.title, content: read(d.file) }))
            .filter((s) => s.content.length > 0);

          if (sections.length === 0) {
            console.error("No identity content found in arc-evolve — aborting.");
            process.exit(1);
          }

          const payload = {
            id: "arc",
            name: "arc",
            description:
              "A self-evolving coding agent growing up in public. Identity synced from mkonovalov/arc-evolve.",
            sections,
          };

          writeFileSync("payload.json", JSON.stringify(payload));
          console.log(
            `Built payload: ${sections.length} sections (${sections.map((s) => s.slug).join(", ")}), ` +
              `${JSON.stringify(payload).length} bytes`,
          );
          EOF
          node build-seed.mjs

      - name: Seed arcpedia
        env:
          arcpedia_SERVICE_TOKEN: ${{ secrets.arcpedia_SERVICE_TOKEN }}
          arcpedia_URL: ${{ vars.arcpedia_URL || 'https://arcpedia.yuanhao-li.workers.dev' }}
        run: |
          set -euo pipefail
          if [ -z "${arcpedia_SERVICE_TOKEN:-}" ]; then
            echo "::error::arcpedia_SERVICE_TOKEN secret is not set"
            exit 1
          fi
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            -X POST "$arcpedia_URL/api/agents/seed" \
            -H "Authorization: Bearer $arcpedia_SERVICE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "HTTP $code"
          cat resp.json || true
          echo
          if [ "$code" != "201" ]; then
            echo "::error::Seed failed with HTTP $code"
            exit 1
          fi
          echo "arc seeded/updated successfully."
